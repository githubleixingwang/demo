server:
  port: 8669
  #自定义访问路径，spring2.0格式
#  servlet:
#    context-path: /
spring:
  cloud:
    discovery:
      enabled: true
      # 禁用 Eureka
      eureka:
        enabled: false
    loadbalancer:
      ribbon:
        enabled: false
      # 全局配置
      cache:
        enabled: true       # 启用缓存
        ttl: 30s            # 缓存过期时间
        capacity: 1000      # 缓存容量
      health-check:
        interval: 10s       # 健康检查间隔
      retry:
        enabled: true       # 启用重试
        max-retries-on-same-service-instance: 2
        max-retries-on-next-service-instance: 1

      # 服务特定配置
      clients:
        test:   # 服务名
          cache:
            ttl: 10s        # 针对此服务的缓存时间
          configurations: weighted # 使用自定义加权策略
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/demo?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: root
    password: 123456

  autoconfigure:
    exclude:
  aop:
    proxy-target-class: false

